<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-dowód</title>
    <style>
      body {
        text-align: center;
      }

        canvas {
            border: 1px solid #000;
        }
  </style>
</head>
<body>
    <h2>
     <img src="https://duckduckgo.com/i/e3cc2cfa6d7bdf63.png" width="3%"/> Twój dokument tożsamości 
  </h2> <br>
    <canvas id="id-card" width="1180" height="716"></canvas>
    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);

            const canvas = document.getElementById('id-card');
            const ctx = canvas.getContext('2d');

            const image = new Image();
            image.src = 'https://www.messenger.com/messenger_media/?attachment_id=517074748140295&message_id=mid.%24cAABa-_8v5W-cV63k22WJmibqL65T&thread_id=100038364620143'; // Zastąp ścieżkę do obrazu wzoru dowodu osobistego
            image.onload = function() {
                ctx.drawImage(image, 0, 0);


                ctx.font = 'bold 24px Arial';
                ctx.fillStyle = 'black';

                ctx.fillText(urlParams.get('Ratman'), 443, 190); // Zastąp odpowiednimi współrzędnymi
                ctx.fillText(urlParams.get('Mikołaj'), 443, 280); // Zastąp odpowiednimi współrzędnymi
                ctx.fillText(urlParams.get('Polskie'), 443, 360); // Zastąp odpowiednimi współrzędnymi
                ctx.fillText(urlParams.get('11.12.2006'), 783, 360); // Zastąp odpowiednimi współrzędnymi
                ctx.fillText(urlParams.get('06321155677'), 443, 460); // Zastąp odpowiednimi współrzędnymi
                ctx.fillText(urlParams.get('Mężczyzna'), 783, 440); // Zastąp odpowiednimi współrzędnymi
                ctx.fillText(urlParams.get('04.08.2026'), 443, 540); // Zastąp odpowiednimi współrzędnymi
                ctx.fillText(urlParams.get('can-number'), 923, 635); // Zastąp odpowiednimi współrzędnymi

                const photo = new Image();
                photo.src = urlParams.get('photo');
                photo.onload = function() {
                    ctx.drawImage(photo, 850, 50, 200, 250); // Zastąp odpowiednimi współrzędnymi i rozmiarami
                };
            };
        };
    </script>
</body>
</html>
